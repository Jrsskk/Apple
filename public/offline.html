<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#4f46e5">
    <title>Offline - EduSync</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8fafc; color: #1e293b; font: 16px system-ui, sans-serif; }
        main { width: min(28rem, calc(100% - 3rem)); padding: 2rem; border: 1px solid #e2e8f0; border-radius: 1rem; background: white; text-align: center; }
        h1 { margin: 0; font-size: 1.4rem; }
        p { color: #64748b; line-height: 1.6; }
        a { display: inline-block; margin-top: .5rem; padding: .75rem 1rem; border-radius: .75rem; background: #4f46e5; color: white; text-decoration: none; }
    </style>
</head>
<body>
    <main>
        <h1>You're offline</h1>
        <p>Pages you previously opened and content you downloaded remain available. Quiz answers and assignment work saved offline will sync after you reconnect.</p>
        <a href="/dashboard">Return to EduSync</a>
    </main>
</body>
</html>
